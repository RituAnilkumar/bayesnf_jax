# Base config for seasonal input type
# All regions share these architecture and training defaults.
# Per-region fields (reg_subdir, paths) are set in bnf_regional_seasonal/r{nn}.yaml

input_type: seasonal

# --- Architecture (fixed across all regions) ---
model_nlayers: 2
model_nhidden: 64
n_fourier: 8
fourier_seed: 42

# --- Training ---
model_nepochs: 2000
lr: 1.0e-3
beta_anneal_epochs: 400       # 20% of model_nepochs — beta ramps 0→1 over this window
seed: 0

# --- Inference ---
model_nensemble: 100          # MC samples at prediction time

# --- Data ---
inp_dir: data_for_model
train_split: full             # 'train' for CV run, 'full' for final pretrained model

# --- Seasonal feature columns (match actual CSV column names exactly) ---
model_ftcols:
  - CenLat
  - CenLon
  - Area
  - Zmed
  - Slope
  - Aspect
  - Zmin
  - Zmax
  - t2m_abl_mean
  - t2m_abl_std
  - t2m_acc_mean
  - t2m_acc_std
  - tp_abl_sum
  - tp_acc_sum
  - ssrd_abl_sum
  - ssrd_acc_sum

rm_fts: []                    # feature columns to drop at runtime (if any)

# --- Output directory (written by Hydra, referenced in code) ---
output_dir: ???               # set by hydra.run.dir via chdir:true — overridden per config

# --- Per-region fields (must be overridden in r{nn}.yaml) ---
reg_subdir: ???
temporal_avg_path: ???
glambie_path: ???
pretrained_params_path: ???
finetuned_params_path: ???

# --- GLaMBIE test split ---
# Years withheld from finetuning and used to evaluate the finetuned model.
# Must be a subset of years in glambie_path. Set per-region as needed.
glambie_test_years: []
