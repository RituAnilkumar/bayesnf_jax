# Base config for seasonal input type
# All regions share these architecture and training defaults.
# Per-region fields (reg_subdir, paths) are set in bnf_regional_seasonal/r{nn}.yaml

input_type: seasonal

# --- Architecture (fixed across all regions) ---
model_nlayers: 2
model_nhidden: 64   # width of each hidden layer
n_fourier: 8
fourier_seed: 42

# --- Training ---
model_nepochs: 50000
lr: 1.0e-3
finetune_lr: 3.0e-4          # Stage 2 initial LR (lower than pretrain; cosine-decayed after beta annealing)
grad_clip_norm: 2.0           # global gradient norm clip for Stage 2 (0 = disabled)
beta_anneal_epochs: 15000       # Set to 20-30% of model_nepochs — beta ramps 0→1 over this window
seed: 0
oggm_loss_fn: rmse           # 'huber' or 'rmse'
heteroscedastic: true        # if true, model outputs (mu, log_sigma_noise) and uses NLL loss
sigma_floor: 0.05             # minimum aleatoric sigma in scaled units (prevents collapse)
huber_delta: 0.5              # Huber transition point in scaled target units (only used if oggm_loss_fn=huber)
glambie_weight: 2.0           # Relative weight of GLaMBIE loss vs Hugonnet temporal-avg loss.
                              # Both losses are per-observation normalised so 1.0 would be equal
                              # weight. Set to 2.0 (not 1.0) to compensate for kl_weight below —
                              # see rationale there. Reduce below 1.0 if GLaMBIE over-fits;
                              # increase further to prioritise regional fit.
kl_weight: 0.5                # Relative weight of KL term (OGGM prior strength). 1.0 = standard
                              # Bayesian continual learning (full-strength anchor to the OGGM
                              # prior); values < 1.0 weaken it.
                              # Set to 0.5 (not 1.0) deliberately: OGGM's own calibration is fit
                              # against Hugonnet geodetic data, so the OGGM-pretrained prior
                              # already carries a Hugonnet-derived signal. A full-strength KL
                              # anchor (1.0) combined with the direct Hugonnet temporal-avg loss
                              # would double-count that signal. kl_weight=0.5 discounts the
                              # prior's pull to correct for this overlap; glambie_weight=2.0
                              # (above) compensates by upweighting GLaMBIE, the one Stage 2
                              # source genuinely independent of OGGM's calibration.
                              # Caveat: this is a blunt correction — kl_weight discounts ALL of
                              # OGGM's prior uniformly, not just the Hugonnet-duplicated part
                              # (it also discounts OGGM's independent physical/climate-response
                              # information). A more surgical fix would restrict
                              # pretrain_year_min/max to years where the OGGM/Hugonnet overlap
                              # is weakest, but that's deferred — see CONTEXT.md.
use_time_encoding: true       # If false, Fourier time features are excluded (purely spatial model).
                              # Set to false to ablate temporal structure.
early_stopping_patience: 100  # stop after this many eval intervals with no val improvement (0 = disabled)
early_stopping_interval: 100 # evaluate val set every N epochs

# --- Inference ---
model_nensemble: 100          # MC samples at prediction time

# --- Data ---
inp_dir: data_for_model
train_split: full             # 'train' for CV run, 'full' for final pretrained model
pretrain_year_min: 1940       # Only use OGGM rows with year >= this value (aligns prior with Hugonnet window)
pretrain_year_max: 2025       # Only use OGGM rows with year <= this value

# --- Seasonal feature columns (match actual CSV column names exactly) ---
model_ftcols:
  - CenLat
  - CenLon
  - log_Area
  - Zmed
  - Slope
  - Aspect
  - Zmin
  - Zmax
  - t2m_abl_mean
  - t2m_abl_std
  - t2m_acc_mean
  - t2m_acc_std
  - tp_abl_sum
  - tp_acc_sum
  - ssrd_abl_sum
  - ssrd_acc_sum

rm_fts: []                    # feature columns to drop at runtime (if any)

# --- Output directory (written by Hydra, referenced in code) ---
output_dir: .                 # set by hydra.run.dir via chdir:true

# --- Per-region fields (must be overridden in r{nn}.yaml) ---
reg_subdir: ???
temporal_avg_path: ???
glambie_path: ???
pretrained_params_path: ???
finetuned_params_path: ???

# --- GLaMBIE validation ---
# Test years are automatically derived as GLaMBIE years > temporal_avg end year.
# No manual configuration needed.
