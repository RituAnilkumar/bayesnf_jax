# Explainability config — Integrated Gradients attributions + seaborn plots
# Override region via: model=bnf_regional_seasonal/r01

defaults:
  - model: bnf_regional_seasonal
  - _self_

model:
  output_dir: .    # resolved to hydra.run.dir by chdir:true

explain:
  # ---------------------------------------------------------------------------
  # Input source — three mutually exclusive options (highest priority first):
  #
  #   ensemble_dir   Point at a region multirun folder (e.g. multirun/r01_3977063/).
  #                  Scans all numbered subdirectories (0/, 1/, …), loads every
  #                  finetuned_params.pkl found, and reads architecture + data config
  #                  from the first subdir's .hydra/config.yaml.
  #                  Captures both VI uncertainty (n_mc_per_model draws per run)
  #                  and structural uncertainty (variation across ensemble members).
  #
  #   run_dir        Point at a single run directory (e.g. multirun/r01_3977063/0/).
  #                  Reads .hydra/config.yaml for architecture + data paths.
  #                  No need to supply model=bnf_regional_seasonal/r01.
  #
  #   params_path    Direct path to a single pkl file.
  #                  Still requires model=bnf_regional_seasonal/r01 for architecture.
  #
  # When ensemble_dir or run_dir is set, model=... on the command line is not needed.
  # ---------------------------------------------------------------------------
  ensemble_dir: null   # e.g. /path/to/multirun/r01_3977063
  run_dir: null        # e.g. /path/to/multirun/r01_3977063/0
  params_path: null    # e.g. /path/to/finetuned_params.pkl  (+ model= required)

  # --- Fallback stage when only params_path or model config is used ---
  stage: finetune      # 'finetune' or 'pretrain'

  # --- Which data split to run on ---
  explain_split: train     # 'train', 'full', 'logo', 'loyo', 'loygo'

  # --- IG hyperparameters ---
  n_mc: 20                 # MC samples per model (single-model modes)
  n_mc_per_model: 5        # MC samples per model in ensemble mode (total = n_models × this)
  n_steps: 50              # Riemann integration steps along the IG path
  baseline: zero           # 'zero' or 'mean'

  # --- Subsampling ---
  max_points: 2000         # cap on data points; subsamples randomly if exceeded
  chunk_size: 500          # inner vmap batch size (reduce if OOM)
  seed: 0                  # numpy seed for reproducible subsampling

  # --- Plots ---
  beeswarm_n_max: 1000     # max points in beeswarm (further subsampled for speed)
  importance_top_k: null   # show all features in importance bar; set e.g. 10 to limit
  dependence_top_k: 6      # top-k features for which dependence plots are saved

  # --- Waterfall: pick one example glacier-year (leave null to skip) ---
  waterfall_rgi_id: null   # e.g. "RGI60-01.00001"
  waterfall_year: null     # e.g. 2010

hydra:
  run:
    dir: outputs/explain/${model.reg_subdir}_${model.input_type}
  job:
    chdir: true
