# Explainability config — Integrated Gradients attributions + seaborn plots
#
# Three modes (highest priority first):
#   explain.ensemble_dir  — region multirun folder, reads .hydra/config.yaml automatically
#   explain.run_dir       — single run directory, reads .hydra/config.yaml automatically
#   explain.params_path   — explicit pkl path (still needs model=bnf_regional_seasonal/r01)
#
# For ensemble_dir and run_dir, model= is NOT required on the command line.

defaults:
  - model: bnf_regional_seasonal
  - _self_

# Provide defaults for mandatory model fields so Hydra can parse the config
# even when model=bnf_regional_seasonal/r01 is not passed on the command line.
# These are overridden by the actual model config when model= is provided,
# and ignored entirely in run_dir/ensemble_dir mode (config is read from .hydra/).
model:
  output_dir: .
  reg_subdir: _explain_best
  input_type: run
  temporal_avg_path: null
  glambie_path: null
  pretrained_params_path: null
  finetuned_params_path: null

explain:
  # ---------------------------------------------------------------------------
  # Input source — three mutually exclusive options (highest priority first):
  #
  #   ensemble_dir   Point at a region multirun folder (e.g. multirun/r01_3977063/).
  #                  Scans all numbered subdirectories (0/, 1/, …), loads every
  #                  finetuned_params.pkl found, and reads architecture + data config
  #                  from the first subdir's .hydra/config.yaml.
  #                  Captures both VI uncertainty (n_mc_per_model draws per run)
  #                  and structural uncertainty (variation across the ensemble).
  #
  #   run_dir        Point at a single run directory (e.g. multirun/r01_3977063/0/).
  #                  Reads .hydra/config.yaml for architecture + data paths.
  #                  No model= needed on the command line.
  #
  #   params_path    Direct path to a single pkl file.
  #                  Requires model=bnf_regional_seasonal/r01 for architecture.
  # ---------------------------------------------------------------------------
  ensemble_dir: null   # e.g. /scratch/.../multirun/r01_3977063
  run_dir: null        # e.g. /scratch/.../multirun/r01_3977063/0
  params_path: null    # e.g. /scratch/.../finetuned_params.pkl  (+ model= required)

  # --- Fallback stage label when using params_path or model config ---
  stage: finetune      # 'finetune' or 'pretrain'

  # --- Which data split to run on ---
  explain_split: train

  # --- IG hyperparameters ---
  n_mc: 20                 # MC samples per model (single-model modes)
  n_mc_per_model: 5        # MC samples per model in ensemble mode (total = n_models × this)
  n_steps: 50              # Riemann integration steps along the IG path
  baseline: zero           # 'zero' or 'mean'

  # --- Subsampling ---
  max_points: 2000         # cap on data points; subsamples randomly if exceeded
  chunk_size: 500          # inner vmap batch size (reduce if OOM)
  seed: 0                  # numpy seed for reproducible subsampling

  # --- Plots ---
  beeswarm_n_max: 1000     # max points in beeswarm (further subsampled for speed)
  importance_top_k: null   # show all features; set e.g. 10 to limit
  dependence_top_k: 6      # top-k features for which dependence plots are saved

  # --- Ensemble model weighting (only used in ensemble_dir mode) ---
  # 'equal' gives every model the same weight (default, always works).
  # 'performance' uses softmax over the composite score from hyperparam_tuning.py
  # (requires metrics_glambie_test.csv / ._cv/metrics_oos.csv in each run subdir).
  weighting: equal               # 'equal' or 'performance'
  softmax_temperature: 0.1       # lower = sharper weighting
  loyo_weight: 0.0               # weight on LOYO RMSE in composite score
  glambie_weight: 1.0            # weight on GLaMBIE RMSE in composite score
  glambie_test_years: [2021, 2022, 2023]
  min_runs: 5                    # minimum runs required to attempt performance weighting
  top_k_models: null             # restrict to top-k models before computing IG (saves time)

  # Features to exclude from a second set of plots (suffix _masked).
  # Useful when dominant features (year, coordinates) compress the scale
  # and obscure variation in the remaining climate/geometry features.
  # The full set of plots (all features) is always generated as well.
  exclude_features:
    - year
    - CenLat
    - CenLon

  # --- Waterfall: pick one example glacier-year (leave null to skip) ---
  waterfall_rgi_id: null   # e.g. "RGI60-01.00001"
  waterfall_year: null     # e.g. 2010

hydra:
  run:
    # Fixed base dir — output subdir is determined at runtime from the run/ensemble path.
    # This avoids interpolating ${model.reg_subdir} which would fail when model= is omitted.
    dir: outputs/explain_best
  job:
    chdir: true
